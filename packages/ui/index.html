<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office EX</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./fonts.css">
  <script type="module" src="./renderer.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="office-titlebar">
      <button class="brand" id="home" aria-label="Office EX home" data-i18n-aria="homeLabel"><img class="brand-icon" src="./office-ex.png" alt="" width="30" height="30"><span>Office EX</span></button>
      <div id="tablist" class="tablist" role="tablist" aria-label="Documents" data-i18n-aria="documents"></div>
      <div class="titlebar-drag-space" aria-hidden="true"></div>
      <div class="titlebar-file-actions"><button id="open" class="titlebar-open">打开文件</button><button id="settings">设置</button><button id="about">关于 Office EX</button></div>
      <div class="toolbar-actions" hidden><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><span class="separator"></span><button id="save-as" disabled>另存为</button><button id="save" class="solid" disabled>保存</button></div>
      <span class="stage-pill" id="product-version"></span>
    </header>
    <aside class="sidebar">
      <nav class="home-navigation" aria-label="Main" data-i18n-aria="mainNav">
        <button id="workspace-nav" class="nav-item">工作台</button>
        <button id="new-menu" class="nav-item">新建</button>
        <button id="recent-nav" class="nav-item">最近文件</button>
        <button id="recovery-nav" class="nav-item">草稿恢复</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="home-sidebar-footer"><span class="online-dot"></span><span data-i18n="local">本地工作 · 离线优先</span></div>
    </aside>
    <main>
      <div id="breadcrumb" hidden></div>
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <section id="content" class="content"></section>
      <footer><span id="status" data-i18n="ready">就绪</span><span id="document-status"></span><span id="footer-version">Office EX</span></footer>
    </main>
  </div>
  <dialog id="settings-dialog"><form method="dialog"><header><h2 data-i18n="settings">设置</h2><button value="close" aria-label="Close" data-i18n-aria="close">×</button></header><label><span data-i18n="theme">外观</span><select id="theme" data-i18n-aria="theme"><option value="system" data-i18n="system">跟随系统</option><option value="light" data-i18n="light">浅色</option><option value="dark" data-i18n="dark">深色</option></select></label><label><span data-i18n="language">语言</span><select id="language" data-i18n-aria="language"></select></label><label><span data-i18n="region">地区格式</span><select id="region" data-i18n-aria="region"></select></label><div class="muted"><span data-i18n="regionSample">地区格式预览</span>: <span id="region-sample" dir="auto"></span></div><label><span data-i18n="documentWindowMode">文档打开方式</span><select id="document-window-mode" data-i18n-aria="documentWindowMode"><option value="windows" data-i18n="documentSeparateWindows">独立窗口</option><option value="tabs" data-i18n="documentTabbedWindows">同一窗口标签页</option></select></label><label><span data-i18n="documentLanguage">新建文档语言（偏好）</span><select id="document-language" data-i18n-aria="documentLanguage"></select></label><p class="muted" data-i18n="documentLanguageNote"></p><button id="clear-recent" type="button" data-i18n="clearRecent">清除最近文件记录</button><p class="muted" data-i18n="settingsNote">设置和恢复快照仅保存在本机。</p></form></dialog>
  <dialog id="about-dialog"><form method="dialog"><header><h2 data-i18n="productAbout">关于 Office EX</h2><button value="close" aria-label="Close" data-i18n-aria="close">×</button></header><div class="about-brand"><img src="./office-ex.png" alt="" width="72" height="72"><div><strong>Office EX</strong><span id="about-version"></span><small data-i18n="previewTag">开发预览版</small></div></div><p data-i18n="welcomeSub"></p><p data-i18n="boundary" class="muted"></p><div class="about-info"><span data-i18n="productLicense">许可证</span><strong>MIT</strong><span data-i18n="productSource">源码</span><code dir="ltr">github.com/xzcode/office-ex</code></div><p class="muted" data-i18n="productNotices">第三方许可证随安装包提供。</p></form></dialog>
</body>
</html>

name: M1 infrastructure
on:
  push:
    branches: [master, m1-infrastructure-20261124, m2-i18n-20261124]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md', 'THIRD_PARTY_NOTICES.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.22.3', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12.14', cache: pip, cache-dependency-path: tests/requirements.txt}
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tests/requirements.txt
      - run: npm run check
        env: {PYTHON: python}
      - run: npm run test:interop
      - run: npm run audit:licenses
      - run: npm audit --audit-level=high
  native-macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.22.3', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run setup:desktop
      - run: node --import tsx --test tests/file-service.test.ts tests/recovery.test.ts tests/ipc-policy.test.ts tests/settings.test.ts
      - run: npm run smoke:desktop
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: m1-native-macos-arm64, path: out/native, if-no-files-found: warn}
  native-other:
    needs: native-macos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.22.3', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run setup:desktop
      - name: Configure the Chromium setuid sandbox on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Install system fonts for the Chinese UI on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fonts-noto-color-emoji
      - run: node --import tsx --test tests/file-service.test.ts tests/recovery.test.ts tests/ipc-policy.test.ts tests/settings.test.ts
      - name: Native Linux smoke with sandbox enabled
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" npm run smoke:desktop
      - name: Native Windows smoke
        if: runner.os == 'Windows'
        run: npm run smoke:desktop
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: m1-native-${{ runner.os }}-${{ runner.arch }}
          path: out/native
          if-no-files-found: warn

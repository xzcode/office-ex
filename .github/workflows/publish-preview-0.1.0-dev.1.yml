# One-shot release authorization: publish the exact previously verified candidate.
# The M5 development branch and default branch remain unchanged.
name: Publish Office EX v0.1.0-dev.1
on:
  push:
    branches: [release/office-ex-v0.1.0-dev.1]
    paths: ['.github/workflows/publish-preview-0.1.0-dev.1.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: office-ex-preview-v0.1.0-dev.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'xzcode/office-ex' && github.ref == 'refs/heads/release/office-ex-v0.1.0-dev.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 398f1a42cf7877fb0b2b436a435b113513d3040c
      SOURCE_RUN: '45616663276'
      VERSION: 0.1.0-dev.1
      TAG: v0.1.0-dev.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 398f1a42cf7877fb0b2b436a435b113513d3040c
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.22.3'}
      - name: Verify exact successful source run and expected artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p out/release-check
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > out/release-check/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > out/release-check/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > out/release-check/artifacts.json
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('out/release-check');read=lambda n:json.loads((p/n).read_text())
          run=read('run.json')
          assert run['head_sha']==os.environ['SOURCE'] and run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/m5.yml' and run['event']=='push'
          jobs=read('jobs.json')['jobs']
          required=['verify','package-preview (ubuntu-24.04, linux, x64)','package-preview (windows-2025, win32, x64)','package-preview (macos-15, darwin, arm64)']
          for n in required:
              matches=[j for j in jobs if j['name']==n]
              assert len(matches)==1 and matches[0]['conclusion']=='success',n
          expected={'office-ex-preview-darwin-arm64':15022662666,'office-ex-preview-win32-x64':15022606556,'office-ex-preview-linux-x64':15022183315}
          artifacts=read('artifacts.json')['artifacts']
          assert {a['name']:a['id'] for a in artifacts}==expected
          assert all(not a['expired'] and a['workflow_run']['head_sha']==os.environ['SOURCE'] for a in artifacts)
          print('Verified exact source, four successful jobs and three non-expired artifacts.')
          PY
      - name: Download and assemble already verified native packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name office-ex-preview-linux-x64 --name office-ex-preview-win32-x64 --name office-ex-preview-darwin-arm64 --dir out/release-input
          node --input-type=module -e 'import {preparePreviewRelease} from "./scripts/prepare-preview-release.mjs"; console.log(JSON.stringify(await preparePreviewRelease("out/release-input","out/release-draft",process.env.VERSION,process.env.TAG,process.env.SOURCE,process.env.SOURCE_RUN),null,2))'
          cd out/release-draft
          sha256sum -c SHA256SUMS
          cat >> RELEASE-NOTES.md <<'NOTES'

          ## 中文说明

          Office EX 首个开发预览版。Windows x64、macOS ARM64、Linux x64 安装包均通过原生构建、安装、启动及移除检查。支持限定范围的 DOC/DOCX、XLS/XLSX、PPT/PPTX 编辑和保存，以及离线 PDF 阅读、Writer/Slides PDF 输出。Windows 尚未签名，macOS 为 ad-hoc 签名且未公证；请保持系统安全保护开启。完整 Office 兼容性与旧格式、性能、语言等正式版验收仍未完成。
          NOTES
      - name: Resume exact draft release, verify and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          tag=os.environ['TAG']
          release_id=458322480
          endpoint=f'repos/{repo}/releases/{release_id}'
          root=Path('out/release-draft')
          expected={p.name:p for p in root.iterdir() if p.is_file() and p.name!='RELEASE-NOTES.md'}
          assert len(expected)==20
          def gh(*args):
              return subprocess.check_output(['gh',*args])
          def state():
              r=json.loads(gh('api',endpoint))
              assert r['id']==release_id and r['tag_name']==tag and r['draft'] and r['prerelease'],'Expected the known unpublished preview draft'
              assert r['name']=='Office EX '+os.environ['VERSION']+' Development Preview','Unexpected release title'
              assert set(a['name'] for a in r['assets'])<=set(expected),'Unexpected existing asset'
              return {a['name']:a for a in r['assets']}
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
              return h.hexdigest()
          def valid_asset(a,p,digest):
              if not a or a['state']!='uploaded' or a['size']!=p.stat().st_size:return False
              if a.get('digest'):return a['digest']=='sha256:'+digest
              # No digest advertised: independently read back actual uploaded bytes.
              dest=Path('out/release-check/readback')
              try:
                  with dest.open('wb') as out:
                      subprocess.run(['gh','api','-H','Accept: application/octet-stream',f'repos/{repo}/releases/assets/{a["id"]}'],stdout=out,check=True)
                  return dest.stat().st_size==p.stat().st_size and sha(dest)==digest
              finally:dest.unlink(missing_ok=True)
          hashes={n:sha(p) for n,p in expected.items()}
          for name,p in sorted(expected.items()):
              for attempt in range(1,5):
                  a=state().get(name)
                  if valid_asset(a,p,hashes[name]):
                      print('Verified',name,flush=True);break
                  if a:
                      # Only replace incomplete/mismatching assets of this exact known draft.
                      gh('api','--method','DELETE',f'repos/{repo}/releases/assets/{a["id"]}')
                  print('Upload',name,'attempt',attempt,flush=True)
                  status=subprocess.run(['gh','release','upload',tag,str(p),'--repo',repo]).returncode
                  if status==0:
                      a=state().get(name)
                      if valid_asset(a,p,hashes[name]):
                          print('Verified',name,flush=True);break
                  if attempt==4:raise RuntimeError('Upload verification failed: '+name)
                  time.sleep(2**attempt)
          assets=state()
          assert set(assets)==set(expected)
          assert all(valid_asset(assets[n],p,hashes[n]) for n,p in expected.items()),'Final asset verification failed'
          print('All 20 assets independently verified; ready to publish.',flush=True)
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > out/release-check/published.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('out/release-check/published.json').read_text())
          assert r['id']==458322480 and r['tag_name']==os.environ['TAG'] and not r['draft'] and r['prerelease'] and r['published_at'] and len(r['assets'])==20
          print('PUBLISHED',r['html_url'],'assets',len(r['assets']))
          PY

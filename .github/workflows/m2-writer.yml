name: M2 Writer core
on:
  push:
    branches: [m2-writer-20261124]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-writer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.22.3', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12.14', cache: pip, cache-dependency-path: tests/requirements.txt}
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tests/requirements.txt
      - run: npm run check
        env: {PYTHON: python}
      - run: npm run test:interop
      - run: npm run audit:licenses
